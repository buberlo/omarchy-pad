# Omarchy Pad gate 0.4: one headless output and nothing else.
# Deliberately does NOT load Omarchy's own config: this is the minimal proof that
# Hyprland can start, render and be screencopied on a render-node-only host.

monitor = HEADLESS-1, 1280x800@60, 0x0, 1

# No X clients in this gate, and Xwayland adds an EGL init and a handshake that can hang
# a headless renderer; keep the test to Wayland only.
xwayland {
    enabled = false
}

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}

debug {
    # damage_tracking = 0 (none): every frame is a full frame. The shm copy-back in
    # patch 0002 then always writes a complete image, which is what the gate checks.
    damage_tracking = 0

    # Hyprland stops logging after a few lines unless disable_logs is cleared, and it
    # moves the log to <runtime>/hypr/<sig>/hyprland.log unless stdout logs stay on.
    disable_logs = false
    enable_stdout_logs = true
}

misc {
    # keep the splash/logo so the frame has actual content to look at
    disable_hyprland_logo = false
    disable_splash_rendering = false
    force_default_wallpaper = 0
}

cursor {
    no_hardware_cursors = true
}
