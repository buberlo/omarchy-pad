# Bring-up configuration for Omarchy Pad: one headless output, no hardware, no effects.
#
# `omarchy-pad-session --minimal` starts Hyprland with this file. The shipped Omarchy
# session uses Omarchy's own configuration instead and layers its iPad overrides from
# ~/.local/state/omarchy/toggles/hypr/zz-ipad.lua on top; this file exists so the
# display bridge, the input injection and the screencopy path can be proven on their own,
# without the shell, the theme or the rest of Omarchy in the picture.
#
# The output size is a starting point: omarchy-pad-bridge reconfigures HEADLESS-1 to the
# iPad window's size with `hyprctl keyword monitor` whenever the app reports a new one.

monitor = HEADLESS-1, 1280x800@60, 0x0, 1

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    focus_on_activate = true
}

cursor {
    # There is no cursor plane and no hardware cursor: the software cursor is drawn into
    # the frame the bridge captures.
    no_hardware_cursors = true
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

xwayland {
    enabled = false
}

input {
    kb_layout = de
    follow_mouse = 1
    sensitivity = 0
}

ecosystem {
    no_update_news = true
}

# A terminal, so there is something on screen to capture.
exec-once = foot --title pad-shell
